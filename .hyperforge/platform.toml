# Deploy config for the Hypermemetic platform (plexus-platform).
# Read by `site_add_from_repo --repo <this-dir>` — see PLATFORM-15.

version = "1"

[site]
kind = "static"
domain = "www.hypermemetic.ai"
zone_id = "a81fdc3125a732050ea621b5c7ccc531"

[build]
command = "npm run build"
output_dir = "dist"
install_command = "npm install"

[deploy]
project_name = "hypermemetic-www"
production_branch = "main"
